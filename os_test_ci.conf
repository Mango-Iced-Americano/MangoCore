mode=run
# 最终评测配置：mask=0x6FDF 全组（初赛 + cagent/buildstorm 决赛组），
# ltp_runner=suite 按 ltp_suites 分 suite 跑；ltp_exclude 为本地初赛盘实测的阻塞用例。
mask=0x6FDF
ltp_runner=suite
ltp_libc=both
ltp_suites=syscalls,fs_bind
ltp_exclude=execve05,fallocate05,fallocate06,mmap16,openat02,fanotify05,fanotify06,openat04,mount_setattr01,cpuctl_test04,rename10,shmctl01,copy_file_range02,pipe13,pipe06,pipe07,splice02,splice07,statfs01_64,timer_settime03,statx11,prot_hsymlinks,send02,futex_cmp_requeue01
ltp_exclude_musl=
ltp_exclude_glibc=
ltp_include=
