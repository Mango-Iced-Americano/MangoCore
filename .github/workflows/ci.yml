name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      qemu_timeout:
        description: Per-architecture QEMU timeout in seconds
        required: false
        default: "7200"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_IMAGE: zhouzhouyi/os-contest:20260510
  # workflow_dispatch may override this; all other events use the 7200s default.
  QEMU_TIMEOUT: ${{ inputs.qemu_timeout || '7200' }}

jobs:
  toolchain-contracts:
    name: Toolchain provisioning contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive      - name: Verify Make and Rustup contracts
        run: |
          set -euo pipefail
          sh scripts/test-toolchain-make-contract.sh
          sh scripts/test-rustup-setup.sh
          sh scripts/test-rustup-preflight.sh
          sh scripts/test-source-purity-make-contract.sh

  full-test:
    name: Serial RV64 and LA64 QEMU score gate
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Free runner disk space
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker compose down --remove-orphans || true
          docker system prune -af || true
          df -h

      - name: Cache official test images
        uses: actions/cache@v4
        with:
          path: |
            fs-img-dir/sdcard-rv.img.xz
            fs-img-dir/sdcard-la.img.xz
          key: oscomp-sdcards-pre-20250615-v1

      - name: Pull and prepare the Docker test environment
        run: |
          set -euo pipefail
          mkdir -p fs-img-dir testresult
          docker compose pull os-dev
          docker compose run --rm -T os-dev bash -lc '
            set -euo pipefail
            if [ ! -s fs-img-dir/sdcard-rv.img.xz ] || [ ! -s fs-img-dir/sdcard-la.img.xz ] || \
                ! xz -t fs-img-dir/sdcard-rv.img.xz || ! xz -t fs-img-dir/sdcard-la.img.xz; then
              rm -f fs-img-dir/sdcard-*.img.xz
              make testsuits-download
            fi
          '

      - name: Write the shared 11-group test configuration
        run: |
          cat > os_test_ci.conf <<'EOF'
          mode=run
          # Current TEST_GROUPS indexes unixbench at bit 5 and ltp at bit 11.
          # 0xFDF selects all 11 scored groups while excluding unixbench/cpython.
          # 0x7FF would incorrectly include unixbench and omit ltp in this tree.
          mask=0xFDF
          ltp_runner=suite
          ltp_libc=both
          ltp_suites=syscalls,fs,fs_perms_simple,fs_readonly,fcntl-locktests
          ltp_exclude=execve05,fallocate06,mmap16,rename10,shmctl01,copy_file_range02,pipe13,splice02,splice07,timer_settime03,statx11,prot_hsymlinks,send02,futex_cmp_requeue01
          ltp_exclude_musl=
          ltp_exclude_glibc=
          ltp_include=
          ltp_from=
          EOF

      - name: Build serial dual-architecture products and inject configuration
        run: |
          docker compose run --rm -T os-dev bash -lc '
            set -euxo pipefail
            make all MODE=release
            xz -dkcf fs-img-dir/sdcard-rv.img.xz > sdcard-rv.img
            make -C os conf-inject CONF_ARCH=rv64 CONF_BLK_MODE=virt CONF_FILE=../os_test_ci.conf
            xz -dkcf fs-img-dir/sdcard-la.img.xz > sdcard-la.img
            make -C os conf-inject CONF_ARCH=la64 CONF_BLK_MODE=virt_pci CONF_FILE=../os_test_ci.conf
          '

      - name: Enforce warning baseline
        run: docker compose run --rm -T os-dev bash -lc 'set -euxo pipefail; make lint'

      - name: Run canonical QEMU runner serially
        id: qemu
        continue-on-error: true
        timeout-minutes: 330
        run: |
          set -o pipefail
          docker compose run --rm -T -e QEMU_TIMEOUT os-dev bash -lc '
            set -euxo pipefail
            python3 scripts/run_full_test.py --serial
          ' 2>&1 | tee testresult/full-test.log

      - name: Score all 11 groups from raw QEMU logs
        id: score
        if: always()
        run: |
          set -u
          shopt -s nullglob
          archives=(testresult/archive_*)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one full-test archive, found ${#archives[@]}"
            exit 1
          fi
          archive="${archives[0]}"
          mkdir -p testresult/scores
          rv_status=0
          la_status=0
          docker compose run --rm -T os-dev python3 scripts/score_test.py \
            --arch rv64 --log "$archive/rv64/qemu.log" --output testresult/scores/rv64.json || rv_status=$?
          docker compose run --rm -T os-dev python3 scripts/score_test.py \
            --arch la64 --log "$archive/la64/qemu.log" --output testresult/scores/la64.json || la_status=$?
          cat testresult/scores/*.json >> "${GITHUB_STEP_SUMMARY:-/dev/null}" 2>/dev/null || true
          test "$rv_status" -eq 0 && test "$la_status" -eq 0

      - name: Upload raw logs and structured scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-qemu-logs-and-scores
          retention-days: 14
          if-no-files-found: warn
          path: |
            os_test_ci.conf
            testresult/

      - name: Fail on QEMU or scoring failure
        if: always() && (steps.qemu.outcome != 'success' || steps.score.outcome != 'success')
        run: |
          echo "::error::QEMU or score gate failed; download ci-qemu-logs-and-scores for raw logs and JSON."
          exit 1
