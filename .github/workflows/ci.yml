name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      qemu_timeout:
        description: Per-architecture QEMU timeout in seconds
        required: false
        default: '7200'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_IMAGE: zhouzhouyi/os-contest:20260510
  # workflow_dispatch may override this; all other events use the 7200s default.
  QEMU_TIMEOUT: ${{ inputs.qemu_timeout || '7200' }}

jobs:
  # ═══════════════════════════════════════════════════════════
  # Job 0 — Toolchain provisioning contracts (unchanged)
  # Lightweight pre-flight validation; runs independently.
  # ═══════════════════════════════════════════════════════════
  toolchain-contracts:
    name: Toolchain provisioning contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify Make and Rustup contracts
        run: |
          set -euo pipefail
          sh scripts/test-toolchain-make-contract.sh
          sh scripts/test-rustup-setup.sh
          sh scripts/test-rustup-preflight.sh
          sh scripts/test-source-purity-make-contract.sh

  # ═══════════════════════════════════════════════════════════
  # Layer 1 — Cargo clippy (static analysis, rv64 only)
  # Expected: <15 min
  # ═══════════════════════════════════════════════════════════
  clippy:
    name: 1. Cargo clippy (static analysis)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [toolchain-contracts]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Docker compose up
        run: docker compose up -d
      - name: Run clippy
        run: |
          docker compose exec -T \
            -e RUSTUP_HOME=/root/.rustup \
            -e CARGO_HOME=/root/.cargo \
            os-dev bash -lc '
              cd /app/os \
              && cargo clippy --features "board_rvqemu block_virt" -- -D warnings
            '
      - name: Docker compose down
        if: always()
        run: docker compose down

  # ═══════════════════════════════════════════════════════════
  # Layer 2 — Cargo test (unit tests, rv64)
  # Expected: <15 min
  # ═══════════════════════════════════════════════════════════
  cargo-test:
    name: 2. Cargo test (unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [clippy]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Docker compose up
        run: docker compose up -d
      - name: Run cargo test
        run: |
          docker compose exec -T \
            -e RUSTUP_HOME=/root/.rustup \
            -e CARGO_HOME=/root/.cargo \
            os-dev bash -lc '
              cd /app/os \
              && cargo test --features "board_rvqemu block_virt"
            '
      - name: Docker compose down
        if: always()
        run: docker compose down

  # ═══════════════════════════════════════════════════════════
  # Layer 3 — Kernel self-tests (ktest, no disks, fast)
  # Rebuilds kernel with ktest cmdline, launches QEMU.
  # Expected: <15 min
  # ═══════════════════════════════════════════════════════════
  ktest:
    name: 3. Kernel self-tests (ktest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [cargo-test]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Docker compose up
        run: docker compose up -d
      - name: Run ktest
        run: |
          docker compose exec -T \
            -e RUSTUP_HOME=/root/.rustup \
            -e CARGO_HOME=/root/.cargo \
            os-dev bash -lc '
              cd /app && make -C os rv64-ktest
            '
      - name: Docker compose down
        if: always()
        run: docker compose down

  # ═══════════════════════════════════════════════════════════
  # Layer 4 — Regression QEMU (initramfs only, no disks)
  # Builds kernel with regression initramfs, runs QEMU, checks
  # for L4 REGRESSION RESULT: PASS.
  # Expected: <15 min
  # ═══════════════════════════════════════════════════════════
  regression:
    name: 4. Regression QEMU test (initramfs only)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [ktest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Docker compose up
        run: docker compose up -d
      - name: Run regression
        run: |
          docker compose exec -T \
            -e RUSTUP_HOME=/root/.rustup \
            -e CARGO_HOME=/root/.cargo \
            os-dev bash -lc '
              cd /app && make test ARCH=rv64 PROFILE=regression
            '
      - name: Docker compose down
        if: always()
        run: docker compose down

  # ═══════════════════════════════════════════════════════════
  # Layer 5 — Competition QEMU (11 test groups, mask=0xFDF)
  # Full competition run with sdcard-rv.img, injected config.
  # Uses the comp target from rv64.mk.
  # Timeout: 350 min (QEMU_TIMEOUT=7200s inside).
  # ═══════════════════════════════════════════════════════════
  comp:
    name: 5. Competition QEMU (mask=0xFDF)
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    needs: [regression]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Free runner disk space
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker compose down --remove-orphans || true
          docker system prune -af || true
          df -h
      - name: Cache official test image
        uses: actions/cache@v4
        with:
          path: |
            fs-img-dir/sdcard-rv.img.xz
          key: oscomp-sdcards-pre-20250615-v1
      - name: Docker compose up
        run: docker compose up -d
      - name: Ensure test image is available
        run: |
          docker compose exec -T os-dev bash -lc '
            set -euo pipefail
            if [ ! -s fs-img-dir/sdcard-rv.img.xz ] || ! xz -t fs-img-dir/sdcard-rv.img.xz; then
              rm -f fs-img-dir/sdcard-rv.img.xz
              make testsuits-download
            fi
          '
      - name: Write 11-group test configuration
        run: |
          cat > os_test_ci.conf <<'EOF'
          mode=run
          # mask=0xFDF selects all 11 scored groups while excluding unixbench/cpython.
          mask=0xFDF
          ltp_runner=suite
          ltp_libc=both
          ltp_suites=syscalls,fs,fs_perms_simple,fs_readonly,fcntl-locktests
          ltp_exclude=execve05,fallocate06,mmap16,rename10,shmctl01,copy_file_range02,pipe13,splice02,splice07,timer_settime03,statx11,prot_hsymlinks,send02,futex_cmp_requeue01
          ltp_exclude_musl=
          ltp_exclude_glibc=
          ltp_include=
          ltp_from=
          EOF
      - name: Build kernel and decompress test image
        run: |
          docker compose exec -T \
            -e RUSTUP_HOME=/root/.rustup \
            -e CARGO_HOME=/root/.cargo \
            os-dev bash -lc '
              set -euxo pipefail
              make -C os rv64-all MODE=release
              xz -dkcf fs-img-dir/sdcard-rv.img.xz > sdcard-rv.img
            '
      - name: Inject test configuration into disk image
        run: |
          docker compose exec -T os-dev bash -lc '
            set -euxo pipefail
            make -C os conf-inject CONF_ARCH=rv64 CONF_BLK_MODE=virt CONF_FILE=../os_test_ci.conf
          '
      - name: Run competition QEMU
        run: |
          set -o pipefail
          docker compose exec -T \
            -e QEMU_TIMEOUT \
            -e RUSTUP_HOME=/root/.rustup \
            -e CARGO_HOME=/root/.cargo \
            os-dev bash -lc '
              set -euxo pipefail
              cd /app/os && timeout ${QEMU_TIMEOUT}s make -f make/rv64.mk comp
            '
      - name: Docker compose down
        if: always()
        run: docker compose down
