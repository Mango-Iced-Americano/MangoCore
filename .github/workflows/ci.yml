name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      qemu_timeout:
        description: Per-architecture QEMU timeout in seconds
        required: false
        default: '7200'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_IMAGE: zhouzhouyi/os-contest:20260510
  QEMU_TIMEOUT: ${{ inputs.qemu_timeout || '7200' }}
  # GitHub runner 在美国，直连 rsproxy.cn 超时；rustup-setup.sh 的默认镜像
  # 只在环境变量未设置时兜底，这里显式指向官方 CDN 并透传给容器。
  RUSTUP_DIST_SERVER: https://static.rust-lang.org
  RUSTUP_UPDATE_ROOT: https://static.rust-lang.org/rustup

jobs:
  # ════════════════════════════════════════════════
  # Job 0 — Toolchain provisioning contracts
  # ════════════════════════════════════════════════
  toolchain-contracts:
    name: Toolchain provisioning contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify Make and Rustup contracts
        run: |
          set -euo pipefail
          sh scripts/test-toolchain-make-contract.sh
          sh scripts/test-rustup-setup.sh
          sh scripts/test-rustup-preflight.sh
          sh scripts/test-source-purity-make-contract.sh

  # ════════════════════════════════════════════════
  # Layer 1 — Cargo clippy (rv64 + la64 serial)
  # ════════════════════════════════════════════════
  clippy:
    name: 1. Cargo clippy (rv64 → la64)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [toolchain-contracts]
    if: always() && !cancelled()
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Docker compose up
        run: docker compose up -d
      - name: Provision toolchain
        run: |
          docker compose exec -T \
            -e RUSTUP_HOME=/root/.rustup \
            -e CARGO_HOME=/root/.cargo -e RUSTUP_DIST_SERVER -e RUSTUP_UPDATE_ROOT \
            os-dev bash -lc '
              # GitHub runner checkout 的文件 owner 是 runner 用户，容器内以 root 跑 git 会触发
              # dubious ownership；prepare-cargo-config 的 submodule 更新会失败。先放行全部目录。
              git config --global --add safe.directory "*"
              make toolchain-setup
            '
      - name: Clippy rv64
        run: |
          docker compose exec -T \
            -e RUSTUP_HOME=/root/.rustup \
            -e CARGO_HOME=/root/.cargo -e RUSTUP_DIST_SERVER -e RUSTUP_UPDATE_ROOT \
            os-dev bash -lc '
              # 对齐 os/make/rv64.mk 真实内核构建 features（riscv + block_virt + oom_handler）
              cd /app/os && cargo clippy --features "riscv block_virt oom_handler" -- -W warnings
            '
      - name: Clippy la64
        run: |
          docker compose exec -T \
            -e RUSTUP_HOME=/root/.rustup \
            -e CARGO_HOME=/root/.cargo -e RUSTUP_DIST_SERVER -e RUSTUP_UPDATE_ROOT \
            os-dev bash -lc '
              # 对齐 os/make/la64.mk 真实内核构建 features（boot_la_qemu 已含 oom_handler，显式列出保持一致）
              cd /app/os && CARGO_BUILD_TARGET=loongarch64-unknown-linux-gnu cargo clippy --features "boot_la_qemu block_virt_pci oom_handler" -- -W warnings
            '
      - name: Docker compose down
        if: always()
        run: docker compose down

  # ════════════════════════════════════════════════
  # Layer 2 — Cargo test (rv64 + la64 serial)
  # ════════════════════════════════════════════════
  cargo-test:
    name: 2. Cargo test (rv64 → la64)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [toolchain-contracts]
    if: always() && !cancelled()
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Docker compose up
        run: docker compose up -d
      - name: Provision toolchain
        run: |
          docker compose exec -T \
            -e RUSTUP_HOME=/root/.rustup \
            -e CARGO_HOME=/root/.cargo -e RUSTUP_DIST_SERVER -e RUSTUP_UPDATE_ROOT \
            os-dev bash -lc '
              # GitHub runner checkout 的文件 owner 是 runner 用户，容器内以 root 跑 git 会触发
              # dubious ownership；prepare-cargo-config 的 submodule 更新会失败。先放行全部目录。
              git config --global --add safe.directory "*"
              make toolchain-setup
            '
      - name: Cargo test rv64
        run: |
          docker compose exec -T \
            -e RUSTUP_HOME=/root/.rustup \
            -e CARGO_HOME=/root/.cargo -e RUSTUP_DIST_SERVER -e RUSTUP_UPDATE_ROOT \
            os-dev bash -lc '
              # The bare-metal target has no libtest runner; unit tests execute on the host.
              cd /app/os && CARGO_BUILD_TARGET=x86_64-unknown-linux-gnu cargo test --lib -p mango-kernel-core
            '
      - name: Cargo test la64
        run: |
          docker compose exec -T \
            -e RUSTUP_HOME=/root/.rustup \
            -e CARGO_HOME=/root/.cargo -e RUSTUP_DIST_SERVER -e RUSTUP_UPDATE_ROOT \
            os-dev bash -lc '
              # The bare-metal target has no libtest runner; unit tests execute on the host.
              cd /app/os && CARGO_BUILD_TARGET=x86_64-unknown-linux-gnu cargo test --lib -p mango-kernel-core
            '
      - name: Docker compose down
        if: always()
        run: docker compose down

  # ════════════════════════════════════════════════
  # Layer 3 — Kernel self-tests (rv64 → la64)
  # ════════════════════════════════════════════════
  ktest:
    name: 3. Kernel self-tests / ktest (rv64 → la64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [toolchain-contracts]
    if: always() && !cancelled()
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Docker compose up
        run: docker compose up -d
      - name: Provision toolchain
        run: |
          docker compose exec -T \
            -e RUSTUP_HOME=/root/.rustup \
            -e CARGO_HOME=/root/.cargo -e RUSTUP_DIST_SERVER -e RUSTUP_UPDATE_ROOT \
            os-dev bash -lc '
              # GitHub runner checkout 的文件 owner 是 runner 用户，容器内以 root 跑 git 会触发
              # dubious ownership；prepare-cargo-config 的 submodule 更新会失败。先放行全部目录。
              git config --global --add safe.directory "*"
              make toolchain-setup
            '
      - name: ktest rv64
        run: |
          docker compose exec -T \
            -e RUSTUP_HOME=/root/.rustup \
            -e CARGO_HOME=/root/.cargo -e RUSTUP_DIST_SERVER -e RUSTUP_UPDATE_ROOT \
            os-dev bash -lc '
              cd /app && make -C os rv64-ktest CORE_NUM=4
            '
      - name: ktest la64
        run: |
          docker compose exec -T \
            -e RUSTUP_HOME=/root/.rustup \
            -e CARGO_HOME=/root/.cargo -e RUSTUP_DIST_SERVER -e RUSTUP_UPDATE_ROOT \
            os-dev bash -lc '
              cd /app && make -C os la64-ktest CORE_NUM=4
            '
      - name: Docker compose down
        if: always()
        run: docker compose down

  # ════════════════════════════════════════════════
  # Layer 4 — Regression QEMU test (rv64 → la64)
  # ════════════════════════════════════════════════
  regression:
    name: 4. Regression QEMU test (rv64 → la64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [toolchain-contracts]
    if: always() && !cancelled()
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Docker compose up
        run: docker compose up -d
      - name: Provision toolchain
        run: |
          docker compose exec -T \
            -e RUSTUP_HOME=/root/.rustup \
            -e CARGO_HOME=/root/.cargo -e RUSTUP_DIST_SERVER -e RUSTUP_UPDATE_ROOT \
            os-dev bash -lc '
              # GitHub runner checkout 的文件 owner 是 runner 用户，容器内以 root 跑 git 会触发
              # dubious ownership；prepare-cargo-config 的 submodule 更新会失败。先放行全部目录。
              git config --global --add safe.directory "*"
              make toolchain-setup
            '
      - name: Regression rv64
        run: |
          docker compose exec -T \
            -e RUSTUP_HOME=/root/.rustup \
            -e CARGO_HOME=/root/.cargo -e RUSTUP_DIST_SERVER -e RUSTUP_UPDATE_ROOT \
            os-dev bash -lc '
              cd /app && make test ARCH=rv64 PROFILE=regression CORE_NUM=4
            '
      - name: Regression la64
        run: |
          docker compose exec -T \
            -e RUSTUP_HOME=/root/.rustup \
            -e CARGO_HOME=/root/.cargo -e RUSTUP_DIST_SERVER -e RUSTUP_UPDATE_ROOT \
            os-dev bash -lc '
              cd /app && make test ARCH=la64 PROFILE=regression CORE_NUM=4
            '
      - name: Docker compose down
        if: always()
        run: docker compose down

  # ════════════════════════════════════════════════
  # Layer 5a — Competition QEMU rv64
  # ════════════════════════════════════════════════
  comp-rv:
    name: 5a. Comp QEMU rv64 (mask=0xFDF)
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    needs: [toolchain-contracts]
    if: always() && !cancelled()
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Free runner disk space
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker compose down --remove-orphans || true
          docker system prune -af || true
          df -h
      - name: Cache official test images
        uses: actions/cache@v4
        with:
          path: fs-img-dir/sdcard-rv.img.xz
          key: oscomp-sdcards-pre-20250615-v3-rv
      - name: Docker compose up
        run: docker compose up -d
      - name: Provision toolchain
        run: |
          docker compose exec -T -e RUSTUP_HOME=/root/.rustup -e CARGO_HOME=/root/.cargo -e RUSTUP_DIST_SERVER -e RUSTUP_UPDATE_ROOT os-dev bash -lc 'git config --global --add safe.directory "*" && make toolchain-setup'
      - name: Ensure test image
        run: |
          docker compose exec -T -e RUSTUP_HOME=/root/.rustup -e CARGO_HOME=/root/.cargo -e RUSTUP_DIST_SERVER -e RUSTUP_UPDATE_ROOT os-dev bash -lc '
            cd /app && mkdir -p fs-img-dir
            if [ ! -s fs-img-dir/sdcard-rv.img.xz ] || ! xz -t fs-img-dir/sdcard-rv.img.xz; then rm -f fs-img-dir/sdcard-rv.img.xz; make testsuits-download; fi'
      # 测试配置直接读取仓库根目录的 os_test_ci.conf（挂载为 /app/os_test_ci.conf），
      # 由 Inject config 步骤经 CONF_FILE=../os_test_ci.conf 注入镜像；修改配置只需改仓库文件。
      - name: Build kernel and decompress image
        run: |
          docker compose exec -T -e RUSTUP_HOME=/root/.rustup -e CARGO_HOME=/root/.cargo -e RUSTUP_DIST_SERVER -e RUSTUP_UPDATE_ROOT os-dev bash -lc '
            set -euxo pipefail; cd /app
            make all MODE=release
            xz -dkcf fs-img-dir/sdcard-rv.img.xz > sdcard-rv.img'
      - name: Inject config
        run: |
          docker compose exec -T -e RUSTUP_HOME=/root/.rustup -e CARGO_HOME=/root/.cargo -e RUSTUP_DIST_SERVER -e RUSTUP_UPDATE_ROOT os-dev bash -lc '
            set -euxo pipefail; cd /app
            make -C os conf-inject CONF_ARCH=rv64 CONF_BLK_MODE=virt CONF_FILE=../os_test_ci.conf'
      - name: Run QEMU
        run: |
          set -euo pipefail
          docker compose exec -T -e QEMU_TIMEOUT -e RUSTUP_HOME=/root/.rustup -e CARGO_HOME=/root/.cargo -e RUSTUP_DIST_SERVER -e RUSTUP_UPDATE_ROOT os-dev bash -lc '
            set -euo pipefail
            cd /app/os && timeout ${QEMU_TIMEOUT}s make -f make/rv64.mk derived-comp CORE_NUM=4 2>&1 | tee /tmp/qemu-rv64.log'
      - name: Score
        if: always()
        run: |
          docker compose exec -T os-dev bash -lc '
            python3 /app/scripts/score_test.py --log /tmp/qemu-rv64.log --arch rv64 --output /tmp/score-rv64.json --table 2>&1; echo "score_exit=$?"'
      - name: Docker compose down
        if: always()
        run: docker compose down

  # ════════════════════════════════════════════════
  # Layer 5b — Competition QEMU la64
  # ════════════════════════════════════════════════
  comp-la:
    name: 5b. Comp QEMU la64 (mask=0xFDF)
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    needs: [toolchain-contracts]
    if: always() && !cancelled()
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Free runner disk space
        run: |
          set -euo pipefail; df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker compose down --remove-orphans || true
          docker system prune -af || true; df -h
      - name: Cache official test images
        uses: actions/cache@v4
        with:
          path: fs-img-dir/sdcard-la.img.xz
          key: oscomp-sdcards-pre-20250615-v3-la
      - name: Docker compose up
        run: docker compose up -d
      - name: Provision toolchain
        run: |
          docker compose exec -T -e RUSTUP_HOME=/root/.rustup -e CARGO_HOME=/root/.cargo -e RUSTUP_DIST_SERVER -e RUSTUP_UPDATE_ROOT os-dev bash -lc 'git config --global --add safe.directory "*" && make toolchain-setup'
      - name: Ensure test image
        run: |
          docker compose exec -T -e RUSTUP_HOME=/root/.rustup -e CARGO_HOME=/root/.cargo -e RUSTUP_DIST_SERVER -e RUSTUP_UPDATE_ROOT os-dev bash -lc '
            cd /app && mkdir -p fs-img-dir
            if [ ! -s fs-img-dir/sdcard-la.img.xz ] || ! xz -t fs-img-dir/sdcard-la.img.xz; then rm -f fs-img-dir/sdcard-la.img.xz; make testsuits-download; fi'
      # 测试配置直接读取仓库根目录的 os_test_ci.conf（挂载为 /app/os_test_ci.conf），
      # 由 Inject config 步骤经 CONF_FILE=../os_test_ci.conf 注入镜像；修改配置只需改仓库文件。
      - name: Build kernel and decompress image
        run: |
          docker compose exec -T -e RUSTUP_HOME=/root/.rustup -e CARGO_HOME=/root/.cargo -e RUSTUP_DIST_SERVER -e RUSTUP_UPDATE_ROOT os-dev bash -lc '
            set -euxo pipefail; cd /app
            make all MODE=release
            xz -dkcf fs-img-dir/sdcard-la.img.xz > sdcard-la.img'
      - name: Inject config
        run: |
          docker compose exec -T -e RUSTUP_HOME=/root/.rustup -e CARGO_HOME=/root/.cargo -e RUSTUP_DIST_SERVER -e RUSTUP_UPDATE_ROOT os-dev bash -lc '
            set -euxo pipefail; cd /app
            make -C os conf-inject CONF_ARCH=la64 CONF_BLK_MODE=virt_pci CONF_FILE=../os_test_ci.conf'
      - name: Run QEMU
        run: |
          set -euo pipefail
          docker compose exec -T -e QEMU_TIMEOUT -e RUSTUP_HOME=/root/.rustup -e CARGO_HOME=/root/.cargo -e RUSTUP_DIST_SERVER -e RUSTUP_UPDATE_ROOT os-dev bash -lc '
            set -euo pipefail
            cd /app/os && timeout ${QEMU_TIMEOUT}s make -f make/la64.mk derived-comp CORE_NUM=4 2>&1 | tee /tmp/qemu-la64.log'
      - name: Score
        if: always()
        run: |
          docker compose exec -T os-dev bash -lc '
            python3 /app/scripts/score_test.py --log /tmp/qemu-la64.log --arch la64 --output /tmp/score-la64.json --table 2>&1; echo "score_exit=$?"'
      - name: Docker compose down
        if: always()
        run: docker compose down
