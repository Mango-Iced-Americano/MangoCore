name: CI Develop

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-develop-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_IMAGE: zhouzhouyi/os-contest:20260510

jobs:
  toolchain-contracts:
    name: Toolchain provisioning contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Verify Rustup and Make provisioning contracts
        run: |
          set -euo pipefail
          sh scripts/test-toolchain-make-contract.sh
          sh scripts/test-rustup-setup.sh
          sh scripts/test-rustup-preflight.sh
          sh scripts/test-source-purity-make-contract.sh

  develop-test:
    name: Develop — Compile + Basic + Busybox
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true

      - name: Prepare directories
        run: mkdir -p fs-img-dir testresult

      - name: Cache test images
        id: cache-sdcards
        uses: actions/cache@v4
        with:
          path: |
            fs-img-dir/sdcard-rv.img.xz
            fs-img-dir/sdcard-la.img.xz
          key: oscomp-sdcards-pre-20250615-v1

      - name: Pull contest container
        run: docker pull "$CI_IMAGE"

      - name: Download test images
        run: |
          docker run --rm --privileged --network host \
            -v "${GITHUB_WORKSPACE}:/app" \
            -w /app \
            "$CI_IMAGE" \
            bash -lc '
              set -euo pipefail
              if [ ! -s fs-img-dir/sdcard-rv.img.xz ] || [ ! -s fs-img-dir/sdcard-la.img.xz ] || \
                 ! xz -t fs-img-dir/sdcard-rv.img.xz || ! xz -t fs-img-dir/sdcard-la.img.xz; then
                rm -f fs-img-dir/sdcard-*.img.xz
                make testsuits-download
              fi
            '

      - name: Build serial dual-architecture products
        run: |
          docker run --rm --privileged --network host \
            -v "${GITHUB_WORKSPACE}:/app" \
            -w /app \
            "$CI_IMAGE" \
            bash -lc 'set -euxo pipefail; make all MODE=release'

      - name: Enforce warning baseline
        run: |
          docker run --rm --privileged --network host \
            -v "${GITHUB_WORKSPACE}:/app" \
            -w /app \
            "$CI_IMAGE" \
            bash -lc 'set -euxo pipefail; make lint'

      - name: Prepare develop config
        run: |
          {
            echo "mode=run"
            echo "mask=0x003"
            echo "ltp_runner=script"
            echo "ltp_libc=both"
            echo "ltp_suites="
            echo "ltp_exclude="
            echo "ltp_exclude_musl="
            echo "ltp_exclude_glibc="
            echo "ltp_include="
            echo "ltp_from="
          } > os_test_develop.conf

      - name: Extract rv64 image + inject config
        run: |
          xz -dkcf fs-img-dir/sdcard-rv.img.xz > sdcard-rv.img
          docker run --rm --privileged --network host \
            -v "${GITHUB_WORKSPACE}:/app" \
            -w /app/os \
            -e ARCH=rv64 -e BLK_MODE=virt \
            -e CONF_FILE=/app/os_test_develop.conf \
            "$CI_IMAGE" \
            bash -lc './inject_os_test_conf.sh'

      - name: Extract la64 image + inject config
        run: |
          xz -dkcf fs-img-dir/sdcard-la.img.xz > sdcard-la.img
          docker run --rm --privileged --network host \
            -v "${GITHUB_WORKSPACE}:/app" \
            -w /app/os \
            -e ARCH=la64 -e BLK_MODE=virt_pci \
            -e CONF_FILE=/app/os_test_develop.conf \
            "$CI_IMAGE" \
            bash -lc './inject_os_test_conf.sh'

      - name: Run QEMU through the serial fail-closed runner
        timeout-minutes: 60
        run: |
          cp os_test_develop.conf os_test.conf
          docker run --rm --privileged --network host \
            -v "${GITHUB_WORKSPACE}:/app" \
            -w /app \
            "$CI_IMAGE" \
            bash -lc 'set -euxo pipefail; python3 scripts/run_full_test.py --serial' \
            2>&1 | tee testresult/full-test.log

      - name: Analyze results
        if: always()
        run: python3 .github/scripts/analyze_os_results.py --mode develop

      - name: Package artifacts
        if: always()
        run: |
          mkdir -p ci-artifacts
          cp -f os_test_develop.conf ci-artifacts/ 2>/dev/null || true
          cp -f kernel-rv kernel-la ci-artifacts/ 2>/dev/null || true
          cp -f disk.img disk-la.img ci-artifacts/ 2>/dev/null || true
          cp -f testresult/output-rv.txt ci-artifacts/ 2>/dev/null || true
          cp -f testresult/output-la.txt ci-artifacts/ 2>/dev/null || true
          cp -f testresult/ci-summary.md ci-artifacts/ 2>/dev/null || true
          cp -f testresult/ci-rv64.json ci-artifacts/ 2>/dev/null || true
          cp -f testresult/ci-la64.json ci-artifacts/ 2>/dev/null || true
          tar -czf ci-develop-artifacts.tgz ci-artifacts

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: develop-test-results
          retention-days: 7
          if-no-files-found: ignore
          path: ci-develop-artifacts.tgz
