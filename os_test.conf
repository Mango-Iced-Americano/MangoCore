## initproc runtime config
## mode: run | shell | run_then_shell
mode=run

## 12-bit testcase mask (bit0..bit11):
## bit0=basic, bit1=busybox, bit2=lua, bit3=libctest,
## bit4=iozone, bit5=unixbench, bit6=iperf, bit7=libcbench,
## bit8=lmbench, bit9=netperf, bit10=cyclictest, bit11=ltp
##
## Local examples:
##   mask=0x001  # only basic
##   mask=0x004  # only lua
##   mask=0x800  # only ltp
##   mask=0xFFF  # all groups
mask=0xFFF

## LTP runner:
##   script: run the official ltp_testcode.sh from the test image.
##           This is the submit-safe default because the grader parses that output.
##   inline: initproc enumerates ltp/testcases/bin itself and supports the filters below.
##           Use this only for local focused LTP debugging.
ltp_runner=script

## LTP libc filter: musl | glibc | both
ltp_libc=both

## The following LTP filters only apply when ltp_runner=inline.
ltp_exclude=
ltp_exclude_musl=
ltp_exclude_glibc=
ltp_include=
ltp_from=
