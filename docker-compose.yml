services:
  os-dev:
    image: ${DOCKER_IMAGE:-zhouzhouyi/os-contest:20260510}
    pull_policy: missing
    network_mode: host
    command: ["sleep", "infinity"]
    privileged: true
    devices:
      # loop devices are needed locally for image mounting; may not exist in CI
      - /dev/loop-control:/dev/loop-control
      - /dev/loop0:/dev/loop0
    device_cgroup_rules:
      - "c 10:237 rmw"
      - "b 7:* rmw"
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - .:/app
      - /etc/localtime:/etc/localtime:ro
    environment:
      - MODE=release
    tty: true
    stdin_open: true
    working_dir: /app

    # IO 限速：仅在存在 /dev/sdb 时生效（本地开发环境），CI 环境跳过
    # 注意：必须用整盘 /dev/sdb 而非分区 /dev/sdb2，blkio 对分区不生效
    # blkio_config:  # 取消注释可在本地启用 IO 限速
    #   device_read_bps:
    #     - path: /dev/sdb
    #       rate: "40m"
    #   device_write_bps:
    #     - path: /dev/sdb
    #       rate: "40m"
