# LA64 专用 CI 评测配置：netperf TCP_CRR 触发 HEAP ALLOCATION FAILED panic 阻塞后续
# 测试组（iperf/libctest/ltp 均未跑到），故 mask 去掉 netperf 位（0x6FDF - 0x200 = 0x6DDF）。
# rv64 使用 os_test_ci.conf（netperf 正常，保留 0x6FDF）。
mode=run
mask=0x6DDF
ltp_runner=suite
ltp_libc=both
ltp_suites=syscalls,fs_bind
ltp_exclude=execve05,fallocate05,fallocate06,mmap16,rename10,shmctl01,copy_file_range02,pipe13,splice02,splice07,timer_settime03,statx11,prot_hsymlinks,send02,futex_cmp_requeue01
ltp_exclude_musl=
ltp_exclude_glibc=
ltp_include=
ltp_from=
